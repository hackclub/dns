name: json-yaml-validate
on:
  push:
    branches:
      - main
  pull_request_target:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  json-yaml-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Overlay changed PR data files
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "pull/${PR_NUMBER}/head:pr-head"
          changed="${RUNNER_TEMP}/changed-yaml.txt"
          git diff --name-status --no-renames --diff-filter=ACMD "origin/${BASE_REF}...pr-head" -- ':(top,glob)*.yaml' > "$changed"
          while IFS=$'\t' read -r change path; do
            case "$change" in
              A|M)
                git checkout pr-head -- "$path"
                ;;
              D)
                git rm -f --ignore-unmatch -- "$path"
                ;;
            esac
          done < "$changed"

      - name: json-yaml-validate
        id: json-yaml-validate
        uses: GrantBirki/json-yaml-validate@v5.0.1
        with:
          comment: "true"

  sort-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Overlay changed PR data files
        id: overlay
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "pull/${PR_NUMBER}/head:pr-head"
          changed="${RUNNER_TEMP}/changed-yaml.txt"
          git diff --name-status --no-renames --diff-filter=ACMD "origin/${BASE_REF}...pr-head" -- ':(top,glob)*.yaml' > "$changed"
          files=()
          while IFS=$'\t' read -r change path; do
            case "$change" in
              A|M)
                git checkout pr-head -- "$path"
                files+=("$path")
                ;;
              D)
                git rm -f --ignore-unmatch -- "$path"
                ;;
            esac
          done < "$changed"
          {
            echo "files<<EOF"
            if [ ${#files[@]} -gt 0 ]; then
              printf '%s\n' "${files[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3"

      - name: Install dependencies
        run: pip install natsort ruamel.yaml

      - name: Check sort order
        id: sort-check
        env:
          CHANGED_YAML: ${{ steps.overlay.outputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            if [ -z "$CHANGED_YAML" ]; then
              echo "No YAML zone files changed."
              exit 0
            fi
            files=()
            while IFS= read -r file; do
              [ -n "$file" ] && files+=("$file")
            done <<< "$CHANGED_YAML"
            if [ ${#files[@]} -eq 0 ]; then
              echo "No YAML zone files changed."
              exit 0
            fi
            python3 bin/sort-zones --check "${files[@]}"
          else
            python3 bin/sort-zones --check
          fi

      - name: Comment on PR if unsorted
        if: failure() && steps.sort-check.outcome == 'failure' && github.event_name == 'pull_request_target'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'REQUEST_CHANGES',
              body: '⚠️ Your DNS record is not sorted in alphabetical order! Please sort it accordingly so your PR can be merged.\n\nSub-sub domains (ex: `badge.shipwrecked.hackclub.com`) should be sorted in alphabetical order under their respective parent subdomain (ex: `shipwrecked.hackclub.com`).'
            })
